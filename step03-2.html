<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 추천 도서</title>
<style>
:root{font-family:system-ui,sans-serif;color:#263245;background:#eef3fc}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:28px 18px 70px}header{text-align:center;padding:16px}h1{font-size:clamp(2rem,6vw,3rem);margin:8px}section{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 24px #293b6314}label{display:block;font-weight:700;margin:14px 0}input,textarea{display:block;width:100%;margin-top:6px;padding:12px;font:inherit;border:1px solid #becbe0;border-radius:9px}textarea{min-height:90px}button{border:0;border-radius:9px;background:#315bbb;color:white;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer;margin:4px 5px 4px 0}button:disabled{opacity:.5}button[aria-pressed=true]{background:#183773}article{padding:16px 0;border-top:1px solid #dfe5ef;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#52657e}#status{min-height:1.5em}
</style></head><body><main>
<header><p>📚 OUR CLASS</p><h1>우리 반 추천 도서</h1><p>좋은 책을 소개하고 친구들의 다양한 작품을 둘러보세요.</p></header>
<section><h2>책 추천하기</h2><p class="muted">실명, 학번, 연락처 등 개인정보는 입력하지 마세요.</p>
<label>책 제목<input id="title" maxlength="120" required placeholder="예: 어린 왕자"></label>
<label>추천 이유<textarea id="reason" maxlength="3000" required></textarea></label>
<label>마음에 남은 점<textarea id="highlight" maxlength="3000"></textarea></label>
<button id="saveButton" type="button">추천 저장</button><p id="status" role="status"></p></section>
<section><h2>기록 둘러보기</h2><button id="mineButton" type="button" aria-pressed="true">내 페이지</button><button id="classButton" type="button" aria-pressed="false">우리 반 둘러보기</button><div id="records" aria-live="polite"></div></section>
</main><script>
/* 학생용 공통 설정: SCRIPT_URL은 선생님이 배포한 주소 그대로 유지합니다.
   APP_ID는 이 파일을 처음 실행한 브라우저에 자동 발급됩니다. 같은 파일을 복제하여
   서로 다른 주소/브라우저에서 사용하면 ID도 달라집니다. 학생별로 고정된 ID가
   필요하다면 교사가 아래 빈 문자열 대신 각각 다른 임의 코드를 넣어 배포합니다. */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz8mPkesqiXtO8mRB0qagPCDklzi6jTHrNPHVthzplHtDnaMmbyvDsrRssX6Derj4pRbw/exec';
const FIXED_APP_ID='';
const TOPIC='추천도서';
const STORAGE_KEY='classAppId:'+location.pathname;
function makeId(){if(crypto.randomUUID)return crypto.randomUUID();return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}
let APP_ID=FIXED_APP_ID||localStorage.getItem(STORAGE_KEY);if(!APP_ID){APP_ID=makeId();localStorage.setItem(STORAGE_KEY,APP_ID)}
const $=id=>document.getElementById(id);let active='mine';
function jsonp(params){return new Promise((resolve,reject)=>{const name='cb_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let finished=false;const timer=setTimeout(()=>finish(new Error('조회 시간이 초과되었습니다. 웹앱 배포와 접근 권한을 확인하세요.')),15000);function finish(err,data){if(finished)return;finished=true;clearTimeout(timer);delete window[name];script.remove();err?reject(err):resolve(data)}window[name]=data=>finish(null,data);script.onerror=()=>finish(new Error('조회 실패. SCRIPT_URL을 확인하세요.'));script.src=SCRIPT_URL+'?'+new URLSearchParams({...params,callback:name});document.head.append(script)})}
function post(payload){const frame=document.createElement('iframe');frame.name='sink_'+Math.random().toString(36).slice(2);frame.hidden=true;const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target=frame.name;form.hidden=true;const field=document.createElement('input');field.name='payload';field.value=JSON.stringify(payload);form.append(field);document.body.append(frame,form);form.submit();setTimeout(()=>{frame.remove();form.remove()},20000)}
async function save(){const title=$('title').value.trim(),reason=$('reason').value.trim();if(!title||!reason){$('status').textContent='책 제목과 추천 이유를 입력하세요.';return}const button=$('saveButton'),recordId=makeId();button.disabled=true;$('status').textContent='저장 확인 중...';try{post({action:'save',recordId,appId:APP_ID,step:3,topic:TOPIC,fields:{책제목:title,추천이유:reason,마음에남은점:$('highlight').value.trim()}});let confirmed=false;for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,650));const result=await jsonp({action:'status',recordId});if(!result.ok)throw Error(result.error);if(result.saved){confirmed=true;break}}if(!confirmed)throw Error('저장 여부를 확인하지 못했습니다. 시트를 확인한 뒤 재시도하세요.');$('status').textContent='저장 완료';$('title').value='';$('reason').value='';$('highlight').value='';await show('mine')}catch(err){$('status').textContent='오류: '+err.message}finally{button.disabled=false}}
async function show(mode){active=mode;$('mineButton').setAttribute('aria-pressed',String(mode==='mine'));$('classButton').setAttribute('aria-pressed',String(mode==='class'));const root=$('records');root.textContent='불러오는 중...';try{const result=await jsonp(mode==='mine'?{action:'read',appId:APP_ID}:{action:'read',scope:'all'});if(!result.ok)throw Error(result.error);root.replaceChildren();for(const item of result.records){const article=document.createElement('article');const heading=document.createElement('strong');heading.textContent=item.topic||'주제 없음';const body=document.createElement('div');body.textContent=Object.entries(item.fields||{}).map(([key,value])=>`${key}: ${value}`).join('\n');const date=document.createElement('small');date.className='muted';date.textContent=item.createdAt||'';article.append(heading,body,date);root.append(article)}if(!result.records.length)root.textContent='아직 기록이 없습니다.'}catch(err){root.textContent='오류: '+err.message}}
$('saveButton').addEventListener('click',save);$('mineButton').addEventListener('click',()=>show('mine'));$('classButton').addEventListener('click',()=>show('class'));show('mine');
</script></body></html>
