<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝이는 나를 소개합니다</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #fff0f6, #f5efff);
      color: #4a4050;
    }

    .card {
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.92);
      padding: 50px 35px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(180, 130, 180, 0.18);
    }

    .sparkle {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #9b6f96;
      margin-bottom: 35px;
    }

    .main-message {
      background: #fff3f8;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .main-message h2 {
      margin-top: 0;
      color: #d56b9d;
    }

    .main-message p {
      font-size: 20px;
      line-height: 1.7;
    }

    .keywords {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .keyword {
      padding: 10px 18px;
      border-radius: 30px;
      background: #eee6ff;
      font-weight: bold;
    }

    .idol {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px dashed #d8c8dd;
    }

    .idol h3 {
      margin-bottom: 8px;
    }

    .idol p {
      line-height: 1.7;
    }

    .footer {
      margin-top: 35px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="sparkle">✨</div>

    <h1>반짝이는 나를 소개합니다</h1>
    <p class="subtitle">중학교 1학년, 나를 표현하는 세 가지 이야기</p>

    <section class="main-message">
      <h2>💗 내가 가장 보여주고 싶은 모습</h2>

      <p>
        나는 <strong>예쁘다는 말을 많이 듣는다.</strong><br>
        그래서 이것은 나를 표현하는 중요한 모습 중 하나이다.
      </p>
    </section>

    <div class="keywords">
      <span class="keyword">🏫 중학생</span>
      <span class="keyword">✨ 엄청 예쁨</span>
      <span class="keyword">🎤 아이돌을 좋아함</span>
    </div>

    <section class="idol">
      <h3>🎧 내가 행복해지는 순간</h3>

      <p>
        나는 아이돌을 좋아한다.<br>
        아이돌을 보고 있으면 행복하다.
      </p>
    </section>

    <p class="footer">
      이것이 지금 내가 소개하고 싶은 나의 모습이다.
    </p>

  </main>

</body>
</html>
