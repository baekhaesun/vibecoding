<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 추천 여행지</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#153b43}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#c6eee9 0%,#eaf7f0 48%,#fff2d5 100%)}main{max-width:800px;margin:auto;padding:26px 18px 70px}header{text-align:center;padding:35px 16px 25px}.eyebrow{color:#087d7a;font-size:.85rem;font-weight:800;letter-spacing:.17em}h1{font-size:clamp(2.2rem,6vw,3.4rem);color:#075b65;margin:10px 0}header p:last-child{color:#426b69}section{background:#ffffffec;border:1px solid white;border-radius:22px;padding:25px;margin:20px 0;box-shadow:0 12px 30px #145c4d16}h2{color:#08676b;margin-top:0}label{display:block;font-weight:700;margin:16px 0}input,textarea{display:block;width:100%;margin-top:7px;padding:13px 14px;font:inherit;color:inherit;border:1px solid #aed3cc;border-radius:12px;background:#fbfffe}input:focus,textarea:focus{outline:2px solid #12a9a3}textarea{min-height:105px;resize:vertical}button{border:0;border-radius:11px;background:#087e7a;color:white;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px 5px 4px 0}button:disabled{opacity:.5}button[aria-pressed=true]{background:#07565c}article{padding:17px 0;border-top:1px solid #d8e9e4;white-space:pre-wrap;overflow-wrap:anywhere}article strong{display:block;color:#08676b;font-size:1.1rem;margin-bottom:7px}.muted{color:#58726e;font-size:.93rem}#status{min-height:1.5em;color:#075b65;font-weight:700}
.cover-card{padding:20px;border-radius:14px;margin-bottom:13px;color:#16424b;white-space:normal}.cover-card .emoji{display:block;font-size:2.2rem}.cover-card .cover-title{font-size:1.15rem;font-weight:800}
</style></head><body><main>
<header><p class="eyebrow">✈️ TRAVEL NOTES · OUR CLASS</p><h1>우리 반 추천 여행지</h1><p>가 보고 싶은 곳과 특별한 여행 이야기를 함께 나눠요.</p></header>
<section><h2>🧭 여행지 추천하기</h2><p class="muted">위치는 도시·지역 정도로 적어 주세요. 실명, 집 주소, 연락처 등 개인정보는 입력하지 마세요.</p>
<label>추천장소<input id="place" maxlength="120" required placeholder="예: 경주 황리단길"></label>
<label>위치<input id="location" maxlength="120" required placeholder="예: 경상북도 경주시"></label>
<label>추천이유<textarea id="reason" maxlength="3000" required placeholder="풍경, 활동, 특별한 경험을 소개해 주세요."></textarea></label>
<button id="saveButton" type="button">여행지 저장</button><p id="status" role="status"></p></section>
<section><h2>기록 둘러보기</h2><button id="mineButton" type="button" aria-pressed="true">내 페이지</button><button id="classButton" type="button" aria-pressed="false">우리 반 둘러보기</button><div id="records" aria-live="polite"></div></section>
</main><script>
/* 학생용 공통 설정: SCRIPT_URL은 선생님이 배포한 주소 그대로 유지합니다.
   APP_ID는 이 파일을 처음 실행한 브라우저에 자동 발급됩니다. 같은 파일을 복제하여
   서로 다른 주소/브라우저에서 사용하면 ID도 달라집니다. 학생별로 고정된 ID가
   필요하다면 교사가 아래 빈 문자열 대신 각각 다른 임의 코드를 넣어 배포합니다. */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz8mPkesqiXtO8mRB0qagPCDklzi6jTHrNPHVthzplHtDnaMmbyvDsrRssX6Derj4pRbw/exec';
const FIXED_APP_ID='';
const TOPIC='추천여행지';
const STORAGE_KEY='classAppId:'+location.pathname;
function makeId(){if(crypto.randomUUID)return crypto.randomUUID();return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}
let APP_ID=FIXED_APP_ID||localStorage.getItem(STORAGE_KEY);if(!APP_ID){APP_ID=makeId();localStorage.setItem(STORAGE_KEY,APP_ID)}
const $=id=>document.getElementById(id);let active='mine';
function jsonp(params){return new Promise((resolve,reject)=>{const name='cb_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let finished=false;const timer=setTimeout(()=>finish(new Error('조회 시간이 초과되었습니다. 웹앱 배포와 접근 권한을 확인하세요.')),15000);function finish(err,data){if(finished)return;finished=true;clearTimeout(timer);delete window[name];script.remove();err?reject(err):resolve(data)}window[name]=data=>finish(null,data);script.onerror=()=>finish(new Error('조회 실패. SCRIPT_URL을 확인하세요.'));script.src=SCRIPT_URL+'?'+new URLSearchParams({...params,callback:name});document.head.append(script)})}
function post(payload){const frame=document.createElement('iframe');frame.name='sink_'+Math.random().toString(36).slice(2);frame.hidden=true;const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target=frame.name;form.hidden=true;const field=document.createElement('input');field.name='payload';field.value=JSON.stringify(payload);form.append(field);document.body.append(frame,form);form.submit();setTimeout(()=>{frame.remove();form.remove()},20000)}
async function save(){const place=$('place').value.trim(),location=$('location').value.trim(),reason=$('reason').value.trim();if(!place||!location||!reason){$('status').textContent='추천장소, 위치, 추천이유를 입력하세요.';return}const button=$('saveButton'),recordId=makeId();button.disabled=true;$('status').textContent='저장 확인 중...';try{post({action:'save',recordId,appId:APP_ID,step:3,topic:TOPIC,fields:{추천장소:place,위치:location,추천이유:reason}});let confirmed=false;for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,650));const result=await jsonp({action:'status',recordId});if(!result.ok)throw Error(result.error);if(result.saved){confirmed=true;break}}if(!confirmed)throw Error('저장 여부를 확인하지 못했습니다. 시트를 확인한 뒤 재시도하세요.');$('status').textContent='저장 완료';$('place').value='';$('location').value='';$('reason').value='';await show('mine')}catch(err){$('status').textContent='오류: '+err.message}finally{button.disabled=false}}
async function show(mode){active=mode;$('mineButton').setAttribute('aria-pressed',String(mode==='mine'));$('classButton').setAttribute('aria-pressed',String(mode==='class'));const root=$('records');root.textContent='불러오는 중...';try{const result=await jsonp(mode==='mine'?{action:'read',appId:APP_ID}:{action:'read',scope:'all',step:3});if(!result.ok)throw Error(result.error);const records = mode === 'class'
  ? result.records.filter(item => Number(item.step) === 3)
  : result.records;

root.replaceChildren();
for (const item of records) {
  const article = document.createElement('article');
  const fields = item.fields || {};
  if (typeof fields.표지이모지 === 'string' && fields.표지이모지 &&
      /^#[0-9a-fA-F]{6}$/.test(fields.표지색 || '')) {
    const cover = document.createElement('div');
    cover.className = 'cover-card';
    cover.style.backgroundColor = fields.표지색;
    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = fields.표지이모지;
    const title = document.createElement('span');
    title.className = 'cover-title';
    title.textContent = fields.추천장소 || item.topic || '추천여행지';
    cover.append(emoji, title);
    article.append(cover);
  }
  const heading = document.createElement('strong');
  heading.textContent = item.topic || '주제 없음';
  const body = document.createElement('div');
  body.textContent = Object.entries(fields)
    .filter(([key]) => key !== '표지이모지' && key !== '표지색')
    .map(([key, value]) => `${key}: ${value}`)
    .join('\n');
  const date = document.createElement('small');
  date.className = 'muted';
  date.textContent = item.createdAt || '';
  article.append(heading, body, date);
  root.append(article);
}
if(!records.length)root.textContent='아직 기록이 없습니다.'}catch(err){root.textContent='오류: '+err.message}}
$('saveButton').addEventListener('click',save);$('mineButton').addEventListener('click',()=>show('mine'));$('classButton').addEventListener('click',()=>show('class'));show('mine');
</script></body></html>
