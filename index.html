<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>바이브 코딩 첫걸음</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f7ff;
      padding: 40px;
    }

    h1 {
      color: #4a5bd5;
    }

    .card {
      background: white;
      width: 500px;
      max-width: 90%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px #cccccc;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🤖 바이브 코딩 첫걸음</h1>

  <p>
    AI와 대화하며 내가 상상한 것을 웹페이지로 만들어 봅시다!
  </p>

  <div class="card">
    <h2>💬 ① 말한다</h2>
    <p>무엇을 만들고 싶은지 AI에게 설명합니다.</p>
  </div>

  <div class="card">
    <h2>▶️ ② 실행한다</h2>
    <p>AI가 만든 코드를 직접 실행해 봅니다.</p>
  </div>

  <div class="card">
    <h2>🔧 ③ 고친다</h2>
    <p>문제를 찾고 AI와 대화하며 더 좋게 고칩니다.</p>
  </div>

  <button onclick="startCoding()">바이브 코딩 시작! 🚀</button>

  <script>
    function startCoding() {
      alert("AI와 함께 상상을 현실로 만들어 봅시다! 🚀");
    }
  </script>

</body>
</html>
